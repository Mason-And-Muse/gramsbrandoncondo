<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Grandmas</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      color: #1a1a2e;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 34rem;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.1; }
    .wave { display: inline-block; animation: wave 2s infinite; transform-origin: 70% 70%; }
    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30% { transform: rotate(14deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(-4deg); }
      50% { transform: rotate(10deg); }
    }
    p { margin-top: 1rem; font-size: 1.125rem; opacity: 0.8; }
    footer { margin-top: 2rem; font-size: 0.875rem; opacity: 0.6; }
  </style>
</head>
<body>
  <main class="card">
    <h1><span class="wave">👋</span> Hello Grandmas!</h1>
    <p>Welcome to <strong>gramsbrandoncondo.store</strong> — coming soon.</p>
    <footer>Served with love via GitHub Pages.</footer>
  </main>
</body>
</html>
